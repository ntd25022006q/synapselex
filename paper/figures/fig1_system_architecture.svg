<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1E293B"/>
    </marker>
    <style>
      .txt-serif { font-family: 'Times New Roman', Times, serif; font-style: italic; }
      .txt-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .box-title { font-size: 10px; font-weight: 600; text-anchor: middle; }
      .math-lbl { font-size: 13px; font-weight: bold; fill: #0F172A; text-anchor: middle; }
    </style>
  </defs>

  <!-- Clean Canvas -->
  <rect x="0" y="0" width="1200" height="360" fill="#FFFFFF"/>

  <!-- ==================== 1. LEFT: QUERY NODES & DYNAMIC GRAPH ==================== -->
  <!-- Node u -->
  <circle cx="40" cy="75" r="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="40" y="80" class="txt-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">u</text>

  <!-- Node v -->
  <circle cx="40" cy="285" r="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="40" y="290" class="txt-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">v</text>

  <!-- Dashed Link u-v with t? -->
  <line x1="40" y1="88" x2="40" y2="162" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="40" y1="198" x2="40" y2="272" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="40" y="184" class="txt-serif" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">t?</text>

  <!-- Dynamic Graph Icon -->
  <g transform="translate(100, 140)">
    <circle cx="16" cy="22" r="4.2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
    <circle cx="42" cy="10" r="4.2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
    <circle cx="34" cy="44" r="4.2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
    <circle cx="64" cy="26" r="4.2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
    <circle cx="80" cy="50" r="4.2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
    <circle cx="56" cy="65" r="4.2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
    
    <line x1="20" y1="20" x2="38" y2="12" stroke="#64748B" stroke-width="1.1"/>
    <line x1="19" y1="26" x2="31" y2="41" stroke="#64748B" stroke-width="1.1"/>
    <line x1="46" y1="13" x2="60" y2="23" stroke="#64748B" stroke-width="1.1"/>
    <line x1="38" y1="42" x2="60" y2="29" stroke="#64748B" stroke-width="1.1"/>
    <line x1="68" y1="30" x2="77" y2="47" stroke="#64748B" stroke-width="1.1"/>
    <line x1="38" y1="46" x2="52" y2="63" stroke="#64748B" stroke-width="1.1"/>
    <line x1="60" y1="64" x2="77" y2="53" stroke="#64748B" stroke-width="1.1"/>
    
    <text x="48" y="86" class="txt-sans" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Dynamic Graph</text>
  </g>

  <!-- Arrows from u, v to Extract boxes -->
  <line x1="53" y1="75" x2="78" y2="75" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="53" y1="285" x2="78" y2="285" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Vertical Arrows from Graph to Extract boxes -->
  <line x1="135" y1="138" x2="135" y2="102.0" stroke="#1E293B" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="135" y1="222" x2="135" y2="258.0" stroke="#1E293B" stroke-width="1.1" marker-end="url(#arr)"/>

  <!-- ==================== 2. EXTRACT FIRST-HOP INTERACTIONS ==================== -->
  <!-- Box u (Lavender) -->
  <rect x="80" y="51.0" width="108" height="48" rx="8" fill="#E8D7F1" stroke="#8E6CA8" stroke-width="1.2"/>
  <text x="134.0" y="71.0" class="txt-sans box-title" fill="#2E1045">Extract First-</text>
  <text x="134.0" y="85.0" class="txt-sans box-title" fill="#2E1045">hop Interactions</text>

  <line x1="188" y1="75" x2="210" y2="75" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="223" y="79" class="txt-serif math-lbl">S<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">u</tspan></text>

  <!-- Box v (Lavender) -->
  <rect x="80" y="261.0" width="108" height="48" rx="8" fill="#E8D7F1" stroke="#8E6CA8" stroke-width="1.2"/>
  <text x="134.0" y="281.0" class="txt-sans box-title" fill="#2E1045">Extract First-</text>
  <text x="134.0" y="295.0" class="txt-sans box-title" fill="#2E1045">hop Interactions</text>

  <line x1="188" y1="285" x2="210" y2="285" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="223" y="289" class="txt-serif math-lbl">S<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">v</tspan></text>

  <!-- Branching Paths from S_u^t and S_v^t to Encoders -->
  <path d="M 235 75 L 260 75 L 260 75 L 282 75" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 235 75 L 260 75 L 260 162 L 282 162" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <path d="M 235 285 L 260 285 L 260 198 L 282 198" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 235 285 L 260 285 L 260 285 L 282 285" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ==================== 3. ENCODING MODULES ==================== -->
  <!-- Top Green Box (Neighbors, Links & Time) -->
  <rect x="285" y="48.0" width="142" height="54" rx="8" fill="#D4EDDA" stroke="#5A9E66" stroke-width="1.2"/>
  <text x="356.0" y="70.0" class="txt-sans box-title" fill="#14421E">Encoding Neighbors,</text>
  <text x="356.0" y="85.0" class="txt-sans box-title" fill="#14421E">Links &amp; Time Intervals</text>

  <!-- Middle Yellow Box (Neighbor Co-occurrences) -->
  <rect x="285" y="153.0" width="142" height="54" rx="8" fill="#FFF3CD" stroke="#C9A844" stroke-width="1.2"/>
  <text x="356.0" y="176.0" class="txt-sans box-title" fill="#4B3B0A">Encoding Neighbor</text>
  <text x="356.0" y="191.0" class="txt-sans box-title" fill="#4B3B0A">Co-occurrences</text>

  <!-- Bottom Green Box (Neighbors, Links & Time) -->
  <rect x="285" y="258.0" width="142" height="54" rx="8" fill="#D4EDDA" stroke="#5A9E66" stroke-width="1.2"/>
  <text x="356.0" y="280.0" class="txt-sans box-title" fill="#14421E">Encoding Neighbors,</text>
  <text x="356.0" y="295.0" class="txt-sans box-title" fill="#14421E">Links &amp; Time Intervals</text>

  <!-- Tokens and Curly Braces for Top Module -->
  <!-- Left Brace from Green Box -->
  <path d="M 431 75 L 437 75 
           M 437 55 Q 441 55 441 65 
           L 441 72 Q 441 75 445 75
           Q 441 75 441 78
           L 441 85 Q 441 95 437 95"
        fill="none" stroke="#1E293B" stroke-width="1.1"/>

  <text x="472" y="57" class="txt-serif math-lbl">X<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">u,N</tspan></text>
  <text x="472" y="79" class="txt-serif math-lbl">X<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">u,E</tspan></text>
  <text x="472" y="101" class="txt-serif math-lbl">X<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">u,T</tspan></text>

  <!-- Right Brace to Top Coral Box -->
  <path d="M 490 55 Q 494 55 494 65
           L 494 72 Q 494 75 498 75
           Q 494 75 494 78
           L 494 85 Q 494 95 490 95
           M 498 75 L 522 75"
        fill="none" stroke="#1E293B" stroke-width="1.1" marker-end="url(#arr)"/>

  <!-- Tokens and Curly Braces for Bottom Module -->
  <!-- Left Brace from Green Box -->
  <path d="M 431 285 L 437 285 
           M 437 265 Q 441 265 441 275 
           L 441 282 Q 441 285 445 285
           Q 441 285 441 288
           L 441 295 Q 441 305 437 305"
        fill="none" stroke="#1E293B" stroke-width="1.1"/>

  <text x="472" y="267" class="txt-serif math-lbl">X<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">v,N</tspan></text>
  <text x="472" y="289" class="txt-serif math-lbl">X<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">v,E</tspan></text>
  <text x="472" y="311" class="txt-serif math-lbl">X<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">v,T</tspan></text>

  <!-- Right Brace to Bottom Coral Box -->
  <path d="M 490 265 Q 494 265 494 275
           L 494 282 Q 494 285 498 285
           Q 494 285 494 288
           L 494 295 Q 494 305 490 305
           M 498 285 L 522 285"
        fill="none" stroke="#1E293B" stroke-width="1.1" marker-end="url(#arr)"/>

  <!-- Tokens and Curly Braces for Middle Yellow Module -->
  <path d="M 431 180 L 437 180 
           M 437 165 Q 441 165 441 172 
           L 441 177 Q 441 180 445 180
           Q 441 180 441 183
           L 441 188 Q 441 195 437 195"
        fill="none" stroke="#1E293B" stroke-width="1.1"/>

  <text x="472" y="172" class="txt-serif math-lbl">X<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">u,C</tspan></text>
  <text x="472" y="196" class="txt-serif math-lbl">X<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">v,C</tspan></text>

  <!-- Right Brace and Routing from Middle Tokens to Coral Boxes -->
  <path d="M 490 165 Q 494 165 494 170 
           L 494 174 Q 494 177 498 177
           Q 494 177 494 180
           L 494 184 Q 494 189 490 189"
        fill="none" stroke="#1E293B" stroke-width="1.1"/>
  
  <path d="M 498 177 L 510 177 L 510 89 L 522 89" fill="none" stroke="#1E293B" stroke-width="1.1" marker-end="url(#arr)"/>
  <path d="M 498 177 L 510 177 L 510 271 L 522 271" fill="none" stroke="#1E293B" stroke-width="1.1" marker-end="url(#arr)"/>

  <!-- ==================== 4. PATCHING, ALIGNMENT & CONCATENATION ==================== -->
  <!-- Top Coral Box (u) -->
  <rect x="525" y="48.0" width="112" height="54" rx="8" fill="#F8D7DA" stroke="#BC707B" stroke-width="1.2"/>
  <text x="581.0" y="66.0" class="txt-sans box-title" fill="#4C1118">Patching &amp;</text>
  <text x="581.0" y="80.0" class="txt-sans box-title" fill="#4C1118">Alignment &amp;</text>
  <text x="581.0" y="94.0" class="txt-sans box-title" fill="#4C1118">Concatenation</text>

  <line x1="637" y1="75" x2="659" y2="75" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="672" y="79" class="txt-serif math-lbl">Z<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">u</tspan></text>

  <!-- Bottom Coral Box (v) -->
  <rect x="525" y="258.0" width="112" height="54" rx="8" fill="#F8D7DA" stroke="#BC707B" stroke-width="1.2"/>
  <text x="581.0" y="276.0" class="txt-sans box-title" fill="#4C1118">Patching &amp;</text>
  <text x="581.0" y="290.0" class="txt-sans box-title" fill="#4C1118">Alignment &amp;</text>
  <text x="581.0" y="304.0" class="txt-sans box-title" fill="#4C1118">Concatenation</text>

  <line x1="637" y1="285" x2="659" y2="285" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="672" y="289" class="txt-serif math-lbl">Z<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">v</tspan></text>

  <!-- Joining Paths from Z_u^t and Z_v^t to Z^t -->
  <path d="M 685 75 L 696 75 L 696 166 L 702 166" fill="none" stroke="#1E293B" stroke-width="1.2"/>
  <path d="M 685 285 L 696 285 L 696 194 L 702 194" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Joint Label Z^t -->
  <text x="668" y="184" class="txt-serif math-lbl" font-size="13">Z<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="11.5" dy="5"> = [Z</tspan><tspan font-size="7.5" dy="-4">t</tspan><tspan font-size="7.5" dy="7">u</tspan><tspan font-size="11.5" dy="-3">; Z</tspan><tspan font-size="7.5" dy="-4">t</tspan><tspan font-size="7.5" dy="7">v</tspan><tspan font-size="11.5" dy="-3">]</tspan></text>
  <line x1="710" y1="180" x2="752" y2="180" stroke="#1E293B" stroke-width="1.2"/>

  <!-- ==================== 5. STACKED TRANSFORMER / GNN BLOCK (× L) ==================== -->
  <!-- Shadow Background Card 2 -->
  <rect x="763" y="14" width="165" height="320" rx="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <!-- Shadow Background Card 1 -->
  <rect x="759" y="17" width="165" height="320" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Foreground Main Card -->
  <rect x="755" y="20" width="165" height="320" rx="14" fill="#EAECEF" stroke="#4B5563" stroke-width="1.3"/>

  <!-- 	imes L label -->
  <text x="908" y="42" class="txt-serif" font-size="13" font-style="italic" font-weight="bold" fill="#374151" text-anchor="end">× L</text>

  <!-- Input path into bottom of block -->
  <path d="M 752 180 L 767 180 L 767 302 L 837.5 302 L 837.5 286" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Layer Normalization 1 (Bottom, Yellow) -->
  <rect x="771" y="250" width="133" height="30" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="837.5" y="269" class="txt-sans box-title" fill="#92400E">Layer Normalization</text>

  <!-- Arrow from LN1 to Multi-Head Attention -->
  <line x1="837.5" y1="250" x2="837.5" y2="222" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Multi-head Self-Attention (Orange) -->
  <rect x="771" y="174" width="133" height="42" rx="6" fill="#FFE5D0" stroke="#EA580C" stroke-width="1.2"/>
  <text x="837.5" y="192" class="txt-sans box-title" fill="#9A3412">Multi-head</text>
  <text x="837.5" y="206" class="txt-sans box-title" fill="#9A3412">Self-Attention</text>

  <!-- Residual 1: Add Circle -->
  <circle cx="837.5" cy="146" r="7.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.1"/>
  <line x1="833.0" y1="146" x2="842.0" y2="146" stroke="#1E293B" stroke-width="1.1"/>
  <line x1="837.5" y1="141.5" x2="837.5" y2="150.5" stroke="#1E293B" stroke-width="1.1"/>
  
  <line x1="837.5" y1="174" x2="837.5" y2="156" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Skip Connection 1 -->
  <path d="M 837.5 294 L 902 294 L 902 146 L 847.5 146" fill="none" stroke="#1E293B" stroke-width="1.1" marker-end="url(#arr)"/>

  <!-- Layer Normalization 2 (Middle, Yellow) -->
  <rect x="771" y="98" width="133" height="30" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="837.5" y="117" class="txt-sans box-title" fill="#92400E">Layer Normalization</text>
  <line x1="837.5" y1="138" x2="837.5" y2="130" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Feed Forward Network (Blue) -->
  <rect x="771" y="42" width="133" height="38" rx="6" fill="#CCE5FF" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="837.5" y="58" class="txt-sans box-title" fill="#0369A1">Feed Forward</text>
  <text x="837.5" y="72" class="txt-sans box-title" fill="#0369A1">Network</text>
  <line x1="837.5" y1="98" x2="837.5" y2="82" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Residual 2: Add Circle -->
  <circle cx="837.5" cy="18" r="7.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.1"/>
  <line x1="833.0" y1="18" x2="842.0" y2="18" stroke="#1E293B" stroke-width="1.1"/>
  <line x1="837.5" y1="13.5" x2="837.5" y2="22.5" stroke="#1E293B" stroke-width="1.1"/>
  
  <line x1="837.5" y1="42" x2="837.5" y2="28" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Skip Connection 2 -->
  <path d="M 837.5 90 L 902 90 L 902 18 L 847.5 18" fill="none" stroke="#1E293B" stroke-width="1.1" marker-end="url(#arr)"/>

  <!-- Exit from Transformer Top to Output Head -->
  <path d="M 837.5 10 L 837.5 -6 L 1030 -6 L 1030 71" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  
  <!-- Label H^t above Average Pooling -->
  <text x="1048" y="32" class="txt-serif math-lbl">H<tspan font-size="8.5" dy="-5">t</tspan></text>

  <!-- ==================== 6. AVERAGE POOLING & DOWNSTREAM TASKS ==================== -->
  <!-- Average Pooling Box (Teal/Cyan) -->
  <rect x="982.5" y="75" width="95" height="42" rx="8" fill="#D1ECF1" stroke="#3FA7B3" stroke-width="1.2"/>
  <text x="1030" y="94" class="txt-sans box-title" fill="#0C5460">Average</text>
  <text x="1030" y="108" class="txt-sans box-title" fill="#0C5460">Pooling</text>

  <!-- Downward Arrows from Pooling to h_u^t and h_v^t -->
  <path d="M 1006 117 L 1006 150" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 1054 117 L 1054 150" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="1006" y="168" class="txt-serif math-lbl">h<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">u</tspan></text>
  <text x="1054" y="168" class="txt-serif math-lbl">h<tspan font-size="8.5" dy="-5">t</tspan><tspan font-size="8.5" dy="8">v</tspan></text>

  <!-- Arrows from h_u, h_v to Downstream Tasks -->
  <path d="M 1006 178 L 1006 222" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 1054 178 L 1054 222" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Downstream Tasks Box (White with Crisp Border) -->
  <rect x="972.5" y="225" width="115" height="48" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="1.3"/>
  <text x="1030" y="247" class="txt-sans box-title" fill="#111827">Downstream</text>
  <text x="1030" y="261" class="txt-sans box-title" fill="#111827">Tasks</text>
</svg>