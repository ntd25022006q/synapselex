<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
  <defs>
    <!-- Shadow filters -->
    <filter id="panelElevation" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardElevation" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    
    <!-- Markers -->
    <marker id="mGreen" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 5 3.5 L 0 6 z" fill="#059669"/>
    </marker>
    <marker id="mAmber" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 5 3.5 L 0 6 z" fill="#d97706"/>
    </marker>
    <marker id="mRed" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 5 3.5 L 0 6 z" fill="#e11d48"/>
    </marker>
    <marker id="mSlate" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 5 3.5 L 0 6 z" fill="#475569"/>
    </marker>
    <marker id="mBlue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 5 3.5 L 0 6 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1240" height="560" fill="#f8fafc" rx="12"/>

  <!-- ==================== PANEL (A): 4-STATE CIVIL CONTRACT AUTOMATON ==================== -->
  <g transform="translate(20, 20)">
    <!-- Container -->
    <rect width="590" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#panelElevation)"/>
    
    <!-- Header Banner -->
    <rect x="0" y="0" width="590" height="46" rx="10" fill="#0f172a"/>
    <rect x="14" y="11" width="28" height="24" rx="4" fill="#2563eb"/>
    <text x="28" y="27" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">A</text>
    <text x="52" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">4-State Civil Contract Automaton M_state = (S, Σ, δ, s_0)</text>
    <text x="52" y="40" font-family="sans-serif" font-size="8.5" fill="#94a3b8">Non-Monotonic Performance Curing &amp; Statutory Prescription under BLDS 2015</text>

    <!-- STATE S0: VALID -->
    <g transform="translate(30, 68)">
      <rect width="210" height="122" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.6" filter="url(#cardElevation)"/>
      <rect x="0" y="0" width="210" height="28" rx="8" fill="#059669"/>
      <text x="14" y="19" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">S_0: Valid Contract</text>
      
      <text x="14" y="48" font-family="serif" font-size="10.5" font-weight="700" fill="#065f46">Enforceable Rights (Art. 117)</text>
      <text x="14" y="66" font-family="sans-serif" font-size="8.5" fill="#334155">• Substantive damages granted</text>
      <text x="14" y="82" font-family="sans-serif" font-size="8.5" fill="#334155">• Art. 328 Forfeit / Double refund</text>
      
      <rect x="12" y="94" width="186" height="18" rx="3" fill="#ffffff" stroke="#a7f3d0" stroke-width="0.8"/>
      <text x="105" y="106" text-anchor="middle" font-family="serif" font-size="8" font-weight="700" fill="#047857">ValidContract ⊓ Voidable ⊑ ⊥</text>
    </g>

    <!-- STATE S1: VOIDABLE -->
    <g transform="translate(340, 68)">
      <rect width="210" height="122" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" filter="url(#cardElevation)"/>
      <rect x="0" y="0" width="210" height="28" rx="8" fill="#d97706"/>
      <text x="14" y="19" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">S_1: Voidable / Formal Defect</text>
      
      <text x="14" y="48" font-family="serif" font-size="10.5" font-weight="700" fill="#92400e">Unnotarized Deed (Art. 129(1))</text>
      <text x="14" y="66" font-family="sans-serif" font-size="8.5" fill="#334155">• Defective in writing / form</text>
      <text x="14" y="82" font-family="sans-serif" font-size="8.5" fill="#334155">• Subject to court annulment</text>
      
      <rect x="12" y="94" width="186" height="18" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="0.8"/>
      <text x="105" y="106" text-anchor="middle" font-family="serif" font-size="8" font-weight="700" fill="#b45309">VoidableContract ⊑ RealEstate</text>
    </g>

    <!-- STATE S3: EXTINGUISHED / TIME-BARRED -->
    <g transform="translate(30, 338)">
      <rect width="210" height="122" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6" filter="url(#cardElevation)"/>
      <rect x="0" y="0" width="210" height="28" rx="8" fill="#334155"/>
      <text x="14" y="19" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">S_3: Extinguished Action</text>
      
      <text x="14" y="48" font-family="serif" font-size="10.5" font-weight="700" fill="#1e293b">Statutory Bar (Art. 429)</text>
      <text x="14" y="66" font-family="sans-serif" font-size="8.5" fill="#475569">• Δτ &gt; 1,095 days (3-Year Lapse)</text>
      <text x="14" y="82" font-family="sans-serif" font-size="8.5" fill="#475569">• Preempts substantive action</text>
      
      <rect x="12" y="94" width="186" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="105" y="106" text-anchor="middle" font-family="serif" font-size="8" font-weight="700" fill="#334155">Extinguished ⊑ ¬Enforceable</text>
    </g>

    <!-- STATE S2: VOID AB INITIO -->
    <g transform="translate(340, 338)">
      <rect width="210" height="122" rx="8" fill="#fef2f2" stroke="#e11d48" stroke-width="1.6" filter="url(#cardElevation)"/>
      <rect x="0" y="0" width="210" height="28" rx="8" fill="#be123c"/>
      <text x="14" y="19" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">S_2: Void Ab Initio</text>
      
      <text x="14" y="48" font-family="serif" font-size="10.5" font-weight="700" fill="#991b1b">Absolute Nullity (Art. 122)</text>
      <text x="14" y="66" font-family="sans-serif" font-size="8.5" fill="#475569">• Sham transaction (Art. 124)</text>
      <text x="14" y="82" font-family="sans-serif" font-size="8.5" fill="#475569">• Restitution in integrum</text>
      
      <rect x="12" y="94" width="186" height="18" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="0.8"/>
      <text x="105" y="106" text-anchor="middle" font-family="serif" font-size="8" font-weight="700" fill="#9f1239">VoidAbInitio ⊑ Restitution</text>
    </g>

    <!-- ================= TRANSITIONS ================= -->
    <!-- Transition S1 -> S0: Curing -->
    <path d="M 340 108 L 248 108" stroke="#059669" stroke-width="2.2" marker-end="url(#mGreen)"/>
    <rect x="254" y="88" width="76" height="18" rx="3" fill="#ffffff" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="292" y="100" text-anchor="middle" font-family="serif" font-size="7.5" font-weight="700" fill="#047857">Art. 129(2) [≥2/3]</text>

    <!-- Transition S1 -> S2: Annulment -->
    <path d="M 445 192 L 445 330" stroke="#e11d48" stroke-width="2" marker-end="url(#mRed)"/>
    <rect x="402" y="252" width="86" height="18" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="445" y="264" text-anchor="middle" font-family="serif" font-size="7.5" font-weight="700" fill="#be123c">Art. 132 [2y Lapse]</text>

    <!-- Transition S0 -> S3: Prescription Lapse -->
    <path d="M 135 192 L 135 330" stroke="#475569" stroke-width="2" marker-end="url(#mSlate)"/>
    <rect x="76" y="252" width="118" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="135" y="264" text-anchor="middle" font-family="serif" font-size="7.5" font-weight="700" fill="#334155">Art. 429 [Δτ &gt; 1095d]</text>

    <!-- Non-monotonic Toll / Reset curve S3 -> S0 -->
    <path d="M 100 338 C 55 268 55 208 100 192" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#mBlue)"/>
    <rect x="18" y="235" width="86" height="26" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="61" y="246" text-anchor="middle" font-family="serif" font-size="7.2" font-weight="700" fill="#1d4ed8">Art. 156 Tolling</text>
    <text x="61" y="256" text-anchor="middle" font-family="serif" font-size="7.2" font-weight="700" fill="#1d4ed8">Art. 157 Reset</text>
  </g>

  <!-- ==================== PANEL (B): DEFEASIBLE ARGUMENTATION GRAPH ==================== -->
  <g transform="translate(630, 20)">
    <!-- Container -->
    <rect width="590" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#panelElevation)"/>
    
    <!-- Header Banner -->
    <rect x="0" y="0" width="590" height="46" rx="10" fill="#0f172a"/>
    <rect x="14" y="11" width="28" height="24" rx="4" fill="#059669"/>
    <text x="28" y="27" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">B</text>
    <text x="52" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Dung Defeasible Argumentation Graph AF = (A, R_defeat)</text>
    <text x="52" y="40" font-family="sans-serif" font-size="8.5" fill="#94a3b8">Adjudication on Judgment No. 12/2024/DS-ST (Long An Provincial Court)</text>

    <!-- ARGUMENT A1: PLAINTIFF SUBSTANTIVE DEMAND -->
    <g transform="translate(30, 68)">
      <rect width="235" height="112" rx="8" fill="#fef2f2" stroke="#e11d48" stroke-width="1.6" filter="url(#cardElevation)"/>
      <rect x="0" y="0" width="235" height="26" rx="8" fill="#be123c"/>
      <text x="12" y="18" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">A_1: Plaintiff Substantive Claim</text>
      
      <text x="12" y="44" font-family="serif" font-size="10" font-weight="700" fill="#991b1b">Deposit Forfeiture (Art. 328 Cl. 2)</text>
      <text x="12" y="60" font-family="sans-serif" font-size="8" fill="#475569">Breach: Refusal to notarize transfer deed</text>
      <text x="12" y="74" font-family="sans-serif" font-size="8" fill="#475569">Remedy: Forfeiture of 500,000,000 VND</text>
      
      <rect x="10" y="86" width="96" height="16" rx="3" fill="#e11d48"/>
      <text x="58" y="97" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#ffffff">DEFEATED</text>
    </g>

    <!-- ARGUMENT A2: DEFENDANT MERITS REBUTTAL -->
    <g transform="translate(325, 68)">
      <rect width="235" height="112" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" filter="url(#cardElevation)"/>
      <rect x="0" y="0" width="235" height="26" rx="8" fill="#d97706"/>
      <text x="12" y="18" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">A_2: Defendant Merits Rebuttal</text>
      
      <text x="12" y="44" font-family="serif" font-size="10" font-weight="700" fill="#92400e">Oral Extension Pact Defense</text>
      <text x="12" y="60" font-family="sans-serif" font-size="8" fill="#475569">Excuses late notarization attendance</text>
      <text x="12" y="74" font-family="sans-serif" font-size="8" fill="#475569">Counter-remedy: Return deposit without penalty</text>
      
      <rect x="10" y="86" width="96" height="16" rx="3" fill="#d97706"/>
      <text x="58" y="97" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#ffffff">REBUTTED</text>
    </g>

    <!-- Symmetric Rebuttal line between A1 and A2 -->
    <line x1="267" y1="120" x2="323" y2="120" stroke="#f59e0b" stroke-width="2" marker-end="url(#mAmber)" marker-start="url(#mAmber)"/>
    <rect x="277" y="103" width="36" height="14" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="0.8"/>
    <text x="295" y="113" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="800" fill="#b45309">rebuts</text>

    <!-- ARGUMENT A3: STATUTORY LIMITATION BAR -->
    <g transform="translate(50, 218)">
      <rect width="490" height="122" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#cardElevation)"/>
      <rect x="0" y="0" width="490" height="28" rx="8" fill="#059669"/>
      <text x="14" y="19" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">A_3: Statutory Limitation Defense (Article 429 BLDS 2015)</text>
      
      <text x="16" y="50" font-family="serif" font-size="10.5" font-weight="700" fill="#065f46">Procedural Latency: Δτ = 1,254 days &gt; 1,095 days (3-Year Statutory Bar)</text>
      <text x="16" y="68" font-family="sans-serif" font-size="8.5" fill="#334155">• No Force Majeure Tolling proven under Art. 156 (dτ/dt = 1 throughout operative span)</text>
      <text x="16" y="84" font-family="sans-serif" font-size="8.5" fill="#334155">• No debt acknowledgment or partial payment restart proven under Art. 157</text>
      
      <rect x="14" y="94" width="280" height="18" rx="3" fill="#059669"/>
      <text x="154" y="106" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#ffffff">STATUS: IN GROUNDED EXTENSION GE(AF)</text>
    </g>

    <!-- Asymmetric Undercut Arrow A3 -> A1 -->
    <path d="M 210 218 L 150 182" stroke="#e11d48" stroke-width="2.5" marker-end="url(#mRed)"/>
    <rect x="116" y="193" width="112" height="18" rx="3" fill="#e11d48"/>
    <text x="172" y="205" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#ffffff">ASYMMETRIC UNDERCUT</text>

    <!-- KNASTER-TARSKI FIXED POINT ADJUDICATION BOX -->
    <g transform="translate(30, 362)">
      <rect width="530" height="138" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6" filter="url(#cardElevation)"/>
      <rect x="0" y="0" width="530" height="28" rx="8" fill="#1e40af"/>
      <text x="16" y="19" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">Knaster-Tarski Least Fixed Point Adjudication Closure</text>

      <rect x="14" y="38" width="502" height="40" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="265" y="55" text-anchor="middle" font-family="serif" font-size="11" font-weight="700" fill="#1e3a8a">F_AF(∅) = [ A_3 ] ➔ F_AF^2(∅) = [ A_3 ] ➔ GE(AF) = [ A_3 ]</text>
      <text x="265" y="70" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Unique Grounded Extension: Procedural Defense Preempts Substantive Claim</text>

      <rect x="14" y="86" width="502" height="42" rx="5" fill="#1e3a8a"/>
      <text x="265" y="103" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">FINAL JUDICIAL DECREE: LAWSUIT DISMISSED AS TIME-BARRED</text>
      <text x="265" y="119" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#93c5fd">Civil Verdict Code 2 (Article 429 Procedural Extinguishment) | 100% Soundness</text>
    </g>

  </g>
</svg>