[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapselex"
version = "0.1.0"
description = "SynapseLex: An Axiomatic Temporal State-Transition Graph Framework for Non-Monotonic Civil Legal Adjudication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nguyen Tien Dat", email = "ntd25022006q@gmail.com"}
]
keywords = [
    "temporal-graphs",
    "legal-ai",
    "legal-judgment-prediction",
    "description-logics",
    "bochner-theorem",
    "non-monotonic-reasoning",
    "neuro-symbolic-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "rdflib>=7.0.0",
    "networkx>=3.0",
    "scipy>=1.11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov"
]

[project.urls]
Homepage = "https://github.com/datbazuka2502/synapselex"
Repository = "https://github.com/datbazuka2502/synapselex"
Affiliation = "International School, Vietnam National University, Hanoi (VNU-IS), Hanoi, Vietnam"

[project.scripts]
synapselex-predict = "synapselex.cli:main"

[tool.setuptools]
package-dir = {"synapselex" = "."}
packages = [
    "synapselex",
    "synapselex.src",
    "synapselex.src.models",
    "synapselex.src.data",
    "synapselex.src.extraction"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
